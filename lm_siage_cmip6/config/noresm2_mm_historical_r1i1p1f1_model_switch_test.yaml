configuration_label: model-data-switch-test

dataset:
  model: NorESM2-MM
  experiment: historical
  variant: r1i1p1f1
  table: SIday
  grid_label: gn

preprocess:
  source_dir: data/input
  recursive: false
  remapped_dir: work/NorESM2-MM/historical/r1i1p1f1_model_switch_test/remapped
  temporary_dir: work/NorESM2-MM/historical/r1i1p1f1_model_switch_test/remapping_tmp
  target_grid_file: /Users/ricavy/Library/CloudStorage/OneDrive-NERSC/Desktop/Remapping_CMIP6/Full_test/Grid_example.nc
  remapper_script: /Users/ricavy/Library/CloudStorage/OneDrive-NERSC/Desktop/Remapping_CMIP6/Full_test/Perturbation_method/Remapping_operational_CMCC-CM2-SR5.py
  weights_file: work/NorESM2-MM/historical/r1i1p1f1_model_switch_test/remapping_weights_k4.npz
  verification_file: output/verification_data/NorESM2-MM/model_switch_test/RemappedInputVerification_NorESM2-MM_historical_r1i1p1f1_first10.nc
  sic_verification_file: output/verification_data/NorESM2-MM/model_switch_test/RemappedSICVerification_NorESM2-MM_historical_r1i1p1f1_first10.nc
  verification_timesteps: 10
  time_chunk: 50
  target_mask_mode: land_only
  # No source-validity extent mask is imposed. Any genuinely uncovered active
  # mesh node is caught later by mesh.missing_drift_policy=error.
  drift_extent_mode: none
  # Keep the inherited four-neighbour remap so this switch test does not also
  # smooth SIC over a larger stencil. Missing active drift is handled below by
  # a separate, bounded and logged mesh-node policy.
  remap_neighbours: 4
  remap_power: 1.0
  remap_max_distance_m: 500000.0
  minimum_valid_drift_weight: 0.5
  fix_index_block: true
  index_block_start: 214
  index_block_end: 218
  index_block_pad: 3
  block_method: idw
  block_idw_power: 2.0
  auto_clip_siconc: true

input_file: work/NorESM2-MM/historical/r1i1p1f1_model_switch_test/remapped/RemappedInput_NorESM2-MM_historical_r1i1p1f1_1850_LAEA.nc
input_pattern: work/NorESM2-MM/historical/r1i1p1f1_model_switch_test/remapped/RemappedInput_NorESM2-MM_historical_r1i1p1f1_*_LAEA.nc
work_dir: work/NorESM2-MM/historical/r1i1p1f1_model_switch_test
output_dir: output/sensitivity_tests/model_data_switches/netcdf

output:
  filename_template: "SeaIceAge_{model}_{experiment}_{variant}_{year}.nc"
  sea_ice_age_name: sea_ice_age
  export_age_fractions: true
  export_uncertainty: false
  export_longitude_latitude: true
  maximum_age_classes: 6

variables:
  concentration: siconc
  eastward_velocity: siu
  northward_velocity: siv
  status_flag: status_flag
  longitude: longitude
  latitude: latitude

projection:
  proj4: "+proj=laea +lat_0=90 +lon_0=0 +x_0=0 +y_0=0 +datum=WGS84 +units=m +no_defs +type=crs"

units:
  internal_distance: km
  internal_time: day

ice:
  concentration_threshold: 0.15
  # Search a broad melt-season window while retaining 15 September as the
  # common annual reference date used by the observational product.
  autumn_search_start: "08-01"
  autumn_search_stop: "09-15"
  # model_linear renormalizes over finite model-ocean cells and applies no
  # observational coastal gap fill or artificial land=zero contribution.
  sic_interpolation_mode: model_linear
  missing_sic_policy: error_on_ice_domain
  daily_sic_dir: work/NorESM2-MM/historical/r1i1p1f1_model_switch_test/sic/daily

age:
  daily_age_dir: work/NorESM2-MM/historical/r1i1p1f1_model_switch_test/age/daily
  gridded_age_dir: work/NorESM2-MM/historical/r1i1p1f1_model_switch_test/grid/daily
  maximum_age_classes: 6
  year_length_days: 365.0
  # The inherited observational clip remains recorded for an A/B test, but is
  # disabled because model convergence/divergence is part of the forcing.
  clip_autumn_area_ratio: false
  autumn_area_ratio_clip: [0.97642671, 1.02437728]

mesh:
  nominal_spacing_km: 25.0
  bamg_hmin_km: 15.0
  bamg_hmax_km: 25.0
  minimum_latitude: 45.0
  ice_domain_buffer_cells: 12
  initial_mesh_file: work/NorESM2-MM/historical/r1i1p1f1_model_switch_test/mesh/mesh_initial.npz
  daily_mesh_dir: work/NorESM2-MM/historical/r1i1p1f1_model_switch_test/mesh/daily
  mapping_subdivisions: 3
  maximum_advection_iterations: 100
  fixed_boundary_layers: 1
  drift_interpolation_mode: model_linear
  missing_drift_policy: nearest_on_ice
  # Strict `error` was tested first and rejected for this dataset: after both
  # fields are on the common LAEA grid, 2.03% of ice-bearing model-ocean
  # cell-times lack drift (0.835% in nominal status cells). The 200 km limit is
  # a hard guard against unbounded extrapolation across the target grid.
  nearest_drift_max_distance_km: 200.0

diagnostics:
  drift_snapshot_dir: work/NorESM2-MM/historical/r1i1p1f1_model_switch_test/diagnostics/drift
  vector_stride: 10
